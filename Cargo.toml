[workspace]
members = [
    "contracts/treasury",
    "contracts/payroll",
    "contracts/claim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ShieldedPay"]
description = "Smart contracts for privacy-first global payroll on Stellar"

[workspace.dependencies]
soroban-sdk = "27.0.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
